[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flask-create-app"
version = "1.0.0"
description = "Modern scaffolding CLI to generate production-ready Flask applications and Application Factory projects."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "BuyAutoParts" }]
dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
flask-create-app = "flask_create_app.cli:main"
create-flask-app = "flask_create_app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["flask_create_app*"]